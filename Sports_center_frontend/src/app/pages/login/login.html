<div class="login-container">

  <div class="login-ambient">
    <span class="sport-shape tennis-ball ball-1"></span>
    <span class="sport-shape tennis-ball ball-2"></span>

    <span class="sport-shape dumbbell dumbbell-1">🏋️</span>
    <span class="sport-shape dumbbell dumbbell-2">🏋️</span>

    <span class="sport-shape water-bubble bubble-1"></span>
    <span class="sport-shape water-bubble bubble-2"></span>
    <span class="sport-shape water-bubble bubble-3"></span>

    <span class="glow glow-1"></span>
    <span class="glow glow-2"></span>
  </div>

  <div class="login-card">

    <h2>Connexion</h2>

    <p>
      Connectez-vous à votre espace.
    </p>

    @if (errorMessage()) {
      <div class="error-message">
        ❌ {{ errorMessage() }}
      </div>
    }

    <label>Email :</label>
    <input
      type="email"
      [ngModel]="email()"
      (ngModelChange)="email.set($event)"
      placeholder="exemple@email.com">

    <label>Mot de passe :</label>
    <input
      type="password"
      [ngModel]="password()"
      (ngModelChange)="password.set($event)"
      placeholder="Mot de passe"
      (keyup.enter)="login()">

    <button
      type="button"
      [disabled]="loading()"
      (click)="login()">
      {{ loading() ? 'Connexion...' : 'Se connecter' }}
    </button>

  </div>

</div>
